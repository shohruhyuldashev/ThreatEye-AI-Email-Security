# Production serving for the React dashboard.
# - Same-origin: proxies /api and /health to the backend (no CORS needed).
# - SPA fallback: any client route (/monitor, /plugins, …) serves index.html so
#   deep links and refreshes work with client-side routing.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache the hashed, per-route chunks; never cache the HTML shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # API + probes → backend, over the compose network.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-Sent Events (real-time monitor) need buffering off + long reads.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location = /health { proxy_pass http://backend:8000; }
    location = /ready  { proxy_pass http://backend:8000; }
    location = /metrics { proxy_pass http://backend:8000; }

    # Client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers for the shell.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
