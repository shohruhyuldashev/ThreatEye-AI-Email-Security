<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ThreatEye — AI-powered email security and phishing detection dashboard.">
    <meta name="theme-color" content="#0a0a0f">
    <title>ThreatEye — AI Email Security</title>
    <!-- Inline SVG favicon (no external request) -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2300ff9d' d='M12 1 3 5v6c0 5 3.8 9.7 9 11 5.2-1.3 9-6 9-11V5l-9-4z'/%3E%3Cpath fill='%230a0a0f' d='M12 6a3 3 0 0 0-3 3v1H8v5h8v-5h-1V9a3 3 0 0 0-3-3zm0 1.8c.7 0 1.2.5 1.2 1.2v1h-2.4V9c0-.7.5-1.2 1.2-1.2z'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2300ff9d' d='M12 1 3 5v6c0 5 3.8 9.7 9 11 5.2-1.3 9-6 9-11V5l-9-4z'/%3E%3C/svg%3E">
    <meta name="robots" content="noindex,nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="dark">
    <meta name="application-name" content="ThreatEye">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind Config for Dark Cyber Theme -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        cyber: {
                            dark: '#0a0a0f',
                            panel: '#13131a',
                            border: '#1f1f2e',
                            neon: '#00ff9d',
                            danger: '#ff3366',
                            warning: '#ffb84d',
                            info: '#00ccff'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>

<body
    class="bg-cyber-dark text-gray-300 font-sans h-screen flex overflow-hidden selection:bg-cyber-neon selection:text-black">

    <!-- Login Overlay -->
    <div id="login-overlay" class="fixed inset-0 z-[100] bg-cyber-dark flex items-center justify-center transition-opacity duration-300">
        <div class="glass-card rounded-xl p-8 max-w-sm w-full mx-4 border border-cyber-border shadow-[0_0_30px_rgba(0,255,157,0.1)]">
            <div class="text-center mb-8">
                <i class="fa-solid fa-shield-halved text-cyber-neon text-4xl mb-4 shadow-cyber-neon/50"></i>
                <h2 class="text-2xl font-bold text-white tracking-wide">Threat<span class="text-cyber-neon">Eye</span></h2>
                <p class="text-xs text-gray-500 mt-2 uppercase tracking-widest">Secure Access Gateway</p>
            </div>
            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-widest mb-1">Username</label>
                    <input type="text" id="login-username" class="cyber-input w-full rounded-lg px-4 py-2 text-sm text-gray-300 focus:border-cyber-neon" placeholder="admin" required>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-widest mb-1">Password</label>
                    <input type="password" id="login-password" class="cyber-input w-full rounded-lg px-4 py-2 text-sm text-gray-300 focus:border-cyber-neon" placeholder="••••••••" required>
                </div>
                <button type="submit" class="w-full py-2.5 bg-cyber-neon text-black font-bold rounded-lg hover:bg-[#00cc7a] transition-all shadow-[0_0_15px_rgba(0,255,157,0.3)] mt-2">
                    Authenticate Process
                </button>
            </form>
            <div id="login-error" class="hidden mt-4 text-center text-xs text-cyber-danger bg-cyber-danger/10 py-2 rounded">
                Invalid credentials detected.
            </div>
        </div>
    </div>

    <!-- Main App Content wrapper -->
    <div id="main-app-content" class="flex w-full h-full opacity-0 pointer-events-none transition-opacity duration-500">
        <!-- Sidebar Navigation -->
    <aside class="w-64 bg-cyber-panel border-r border-cyber-border flex flex-col transition-all duration-300">
        <div class="h-16 flex items-center px-6 border-b border-cyber-border">
            <i class="fa-solid fa-shield-halved text-cyber-neon text-2xl mr-3"></i>
            <span class="text-white font-semibold text-lg tracking-wide">Threat<span
                    class="text-cyber-neon">Eye</span></span>
        </div>

        <nav class="flex-1 max-h-[calc(100vh-64px)] overflow-y-auto px-4 py-6 space-y-2 custom-scrollbar">
            <!-- Nav Items -->
            <a href="#" data-target="dashboard"
                class="nav-btn active flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors group">
                <i class="fa-solid fa-chart-line w-6 text-gray-400 group-hover:text-cyber-neon transition-colors"></i>
                <span class="group-hover:text-white">Dashboard</span>
            </a>
            <a href="#" data-target="monitoring"
                class="nav-btn flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors group">
                <i
                    class="fa-solid fa-satellite-dish w-6 text-gray-400 group-hover:text-cyber-neon transition-colors"></i>
                <span class="group-hover:text-white">Real-Time Monitor</span>
            </a>
            <a href="#" data-target="quarantine"
                class="nav-btn flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors group">
                <i class="fa-solid fa-box-archive w-6 text-gray-400 group-hover:text-cyber-neon transition-colors"></i>
                <span class="group-hover:text-white">Quarantine</span>
                <span id="sidebar-quarantine-count" class="ml-auto bg-cyber-danger/20 text-cyber-danger py-0.5 px-2 rounded-full text-xs hidden">0</span>
            </a>
            <a href="#" data-target="simulation"
                class="nav-btn flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors group">
                <i class="fa-solid fa-vial-virus w-6 text-gray-400 group-hover:text-cyber-neon transition-colors"></i>
                <span class="group-hover:text-white">Simulations</span>
            </a>
            <a href="#" data-target="urlanalyzer"
                class="nav-btn flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors group">
                <i class="fa-solid fa-link w-6 text-gray-400 group-hover:text-cyber-neon transition-colors"></i>
                <span class="group-hover:text-white">URL Analyzer</span>
            </a>
            <a href="#" data-target="analytics"
                class="nav-btn flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors group">
                <i class="fa-solid fa-chart-pie w-6 text-gray-400 group-hover:text-cyber-neon transition-colors"></i>
                <span class="group-hover:text-white">Analytics</span>
            </a>
            <a href="#" data-target="soc"
                class="nav-btn flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors group">
                <i class="fa-solid fa-shield-halved w-6 text-gray-400 group-hover:text-cyber-neon transition-colors"></i>
                <span class="group-hover:text-white">SOC Center</span>
            </a>
            <a href="#" data-target="framework"
                class="nav-btn flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors group">
                <i class="fa-solid fa-cubes-stacked w-6 text-gray-400 group-hover:text-cyber-neon transition-colors"></i>
                <span class="group-hover:text-white">Framework</span>
            </a>
            <a href="#" data-target="team" id="nav-team"
                class="nav-btn admin-only flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors group">
                <i class="fa-solid fa-users-gear w-6 text-gray-400 group-hover:text-cyber-neon transition-colors"></i>
                <span class="group-hover:text-white">Team &amp; Access</span>
            </a>
        </nav>

        <div class="p-4 border-t border-cyber-border mt-auto">
            <a href="#" data-target="settings"
                class="nav-btn flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors group">
                <i class="fa-solid fa-gear w-6 text-gray-400 group-hover:text-cyber-neon transition-colors"></i>
                <span class="group-hover:text-white">Settings</span>
            </a>
            <div class="mt-4 flex flex-col px-4 space-y-3">
                <div class="flex items-center">
                    <div class="w-8 h-8 rounded-full bg-cyber-border flex items-center justify-center text-cyber-neon font-bold text-sm">
                        A</div>
                    <div class="ml-3">
                        <p class="text-xs text-white font-medium">Admin User</p>
                        <p class="text-[10px] text-gray-500">Security Team</p>
                    </div>
                </div>
                <button onclick="logout()" class="w-full py-1.5 text-xs text-gray-400 hover:text-cyber-danger border border-cyber-border hover:border-cyber-danger/50 rounded transition-colors flex items-center justify-center">
                    <i class="fa-solid fa-arrow-right-from-bracket mr-2"></i> Log Out
                </button>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main
        class="flex-1 flex flex-col min-w-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-cyber-panel to-cyber-dark">
        <!-- Top Navbar -->
        <header
            class="h-16 flex items-center justify-between px-8 border-b border-cyber-border/50 bg-cyber-dark/50 backdrop-blur-sm z-10">
            <div class="flex items-center space-x-6">
                <!-- Status Indicators -->
                <div
                    class="flex items-center space-x-2 bg-cyber-panel border border-cyber-neon/30 px-3 py-1.5 rounded-full">
                    <div class="w-2 h-2 rounded-full bg-cyber-neon animate-pulse"></div>
                    <span class="text-xs font-medium text-cyber-neon">AI Engine: Active</span>
                </div>
                <div
                    id="top-sim-container" class="flex items-center space-x-2 bg-cyber-panel border border-cyber-info/30 px-3 py-1.5 rounded-full transition-colors">
                    <div id="top-sim-dot" class="w-2 h-2 rounded-full bg-cyber-info animate-pulse delay-75 transition-colors"></div>
                    <span id="top-sim-text" class="text-xs font-medium text-cyber-info transition-colors">Simulations: Running</span>
                </div>
            </div>

            <div class="flex items-center space-x-4">
                <div class="relative">
                    <button id="notification-btn" class="relative p-2 text-gray-400 hover:text-white transition-colors">
                        <i class="fa-regular fa-bell text-lg"></i>
                        <span id="notification-badge"
                            class="absolute top-1.5 right-1.5 w-2 h-2 bg-cyber-danger rounded-full border border-cyber-dark hidden"></span>
                    </button>
                    <!-- Dropdown -->
                    <div id="notification-dropdown"
                        class="absolute right-0 mt-2 w-80 bg-cyber-panel border border-cyber-border rounded-lg shadow-xl hidden z-50">
                        <div
                            class="p-3 border-b border-cyber-border/50 text-sm font-semibold text-white flex justify-between">
                            <span>Recent Alerts</span>
                        </div>
                        <ul id="notification-list" class="max-h-64 overflow-y-auto custom-scrollbar">
                            <!-- Items injected via JS -->
                        </ul>
                    </div>
                </div>
            </div>
        </header>

        <!-- View Container -->
        <div id="view-container" class="flex-1 overflow-y-auto p-8 custom-scrollbar">
            <!-- Views will be injected here via JS -->
        </div>
    </main>

    <!-- Custom Modal -->
    <div id="custom-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
        <div class="bg-cyber-panel border border-cyber-border rounded-lg shadow-2xl w-full max-w-md transform scale-95 transition-transform duration-300 overflow-hidden" id="custom-modal-content">
            <div class="px-6 py-4 border-b border-cyber-border flex justify-between items-center bg-cyber-dark/50">
                <h3 id="modal-title" class="text-white font-semibold text-lg flex items-center">
                    <i class="fa-solid fa-circle-exclamation text-cyber-neon mr-2" id="modal-icon"></i> <span id="modal-title-text">Notification</span>
                </h3>
                <button id="modal-close-icon" class="text-gray-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-6">
                <p id="modal-message" class="text-gray-300"></p>
            </div>
            <div class="px-6 py-4 border-t border-cyber-border bg-cyber-dark/30 flex justify-end space-x-3">
                <button id="modal-cancel-btn" class="px-4 py-2 text-sm font-medium text-gray-400 hover:text-white transition-colors hidden">Cancel</button>
                <button id="modal-confirm-btn" class="px-4 py-2 text-sm font-medium bg-cyber-neon/10 border border-cyber-neon text-cyber-neon hover:bg-cyber-neon/20 rounded transition-colors">OK</button>
            </div>
        </div>
    </div>

    <!-- Custom Toast -->
        <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-3 pointer-events-none"></div>

    </div> <!-- End Main App Content -->

    <script src="app.js?v=19"></script>
</body>

</html>
