# Serving for the vanilla dashboard (frontend/app.js).
#
# Same-origin by design: the page and the API are both served from this origin, so
# `/api` is proxied to the backend instead of the browser calling http://localhost:8000
# directly. That cross-origin setup was the cause of the "cookies missing / re-login on
# every click" bug — httpOnly session cookies set by :8000 were not reliably sent back
# from a page on :3000 (and broke entirely under 127.0.0.1 vs localhost). Proxying here
# means the browser sees one origin and the session cookies just work.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html { add_header Cache-Control "no-store"; }

    # API → backend over the compose network (same-origin to the browser).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-Sent Events (real-time monitor stream) need buffering off + long reads.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location = /health  { proxy_pass http://backend:8000; }
    location = /ready   { proxy_pass http://backend:8000; }
    location = /metrics { proxy_pass http://backend:8000; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
