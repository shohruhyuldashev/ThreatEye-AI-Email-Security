services:
  gophish:
    image: gophish/gophish:latest
    container_name: gophish
    ports:
      - "3333:3333"
      - "80:80"
    restart: unless-stopped
    volumes:
      - gophish_data:/opt/gophish

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    # Bound to localhost: the model server has no auth and is only used by the backend.
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
    # Serve first and STAY UP; pulling the model is best-effort so a slow/failed
    # registry never crash-loops the container (a restart aborts any manual pull).
    entrypoint: ["/bin/sh","-c","ollama serve & sleep 5 && (ollama pull \"$$OLLAMA_MODEL\" || echo \"[ollama] auto-pull failed for $$OLLAMA_MODEL; pull it manually: docker exec ollama ollama pull qwen2.5:3b\"); wait"]
    # Cap memory so a big model can't take the host down (host has no swap).
    mem_limit: 6g
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: threateye_postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-threateye}
      - POSTGRES_USER=${POSTGRES_USER:-threateye}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-threateye}
    # Bound to localhost: the DB is only consumed by the backend over the compose
    # network, so it should never be reachable from the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: threateye_redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Localhost-only: used for shared rate-limit state across backend replicas.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mail_server:
    image: mailserver/docker-mailserver:latest
    container_name: mail_server
    hostname: mail.example.com
    ports:
      - "2525:25"
      - "3143:143"
    environment:
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=0
      - ENABLE_POSTGREY=0
      - ENABLE_UPDATE_CHECK=0
      - ONE_DIR=1
      - PERMIT_DOCKER=network
      - POSTMASTER_ADDRESS=postmaster@example.com
    volumes:
      - ./mail-data/:/var/mail/
      - ./mail-state/:/var/mail-state/
      - ./mail-logs/:/var/log/mail/
      - ./mail-config/:/tmp/docker-mailserver/
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      # Build with host networking so pip can resolve PyPI (the isolated build
      # network has no DNS in some environments).
      network: host
    container_name: phishing_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      # Sample .tap packs, mounted where the repo-relative test path resolves to
      # inside the container (/app/tests/../../plugins).
      - ./plugins:/plugins:ro
    environment:
      - GOPHISH_URL=http://gophish:3333
      - GOPHISH_API_KEY=${GOPHISH_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-ollama}
      - OPENAI_API_BASE=http://ollama:11434/v1
      - AI_MODEL=${AI_MODEL:-qwen2.5:3b}
      - THREATEYE_AUTH_SECRET=${THREATEYE_AUTH_SECRET:-change-me-in-production}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - GOPHISH_VERIFY_TLS=${GOPHISH_VERIFY_TLS:-false}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-threateye}:${POSTGRES_PASSWORD:-threateye}@postgres:5432/${POSTGRES_DB:-threateye}
      - SIEM_WEBHOOK_URL=${SIEM_WEBHOOK_URL:-}
      - SIEM_FORMAT=${SIEM_FORMAT:-raw}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CLAMAV_TCP=${CLAMAV_TCP:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-90}
    depends_on:
      gophish:
        condition: service_started
      ollama:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Production dashboard: the React SPA (modern per-route code-split routing),
  # served by nginx which also reverse-proxies /api to the backend (same-origin).
  dashboard:
    build:
      context: ./frontend-react
      # Host networking so npm can reach the registry during the build.
      network: host
    container_name: threateye_dashboard
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Legacy single-file dashboard (frontend/app.js) — kept for reference.
  frontend:
    build:
      context: ./frontend
    container_name: phishing_frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
    restart: unless-stopped


  webmail:
    image: roundcube/roundcubemail:latest
    container_name: webmail
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=tls://mail_server
      - ROUNDCUBEMAIL_DEFAULT_PORT=143
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://mail_server
      - ROUNDCUBEMAIL_SMTP_PORT=25
    ports:
      - "8080:80"
    depends_on:
      - mail_server
    restart: unless-stopped

  # Optional TLS reverse proxy. Enable with:  docker compose --profile production up
  # Terminates HTTPS and proxies the dashboard + API behind one origin.
  caddy:
    image: caddy:2-alpine
    container_name: threateye_caddy
    profiles: ["production"]
    ports:
      - "443:443"
      - "8443:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # SIEM (optional): Elasticsearch + Kibana. Start with:
  #   docker compose --profile siem up -d elasticsearch kibana
  # ThreatEye forwards ECS-formatted alerts to http://elasticsearch:9200/threateye-alerts/_doc
  #
  # NOTE: security is DISABLED here because this is a self-contained lab stack.
  # For anything internet-facing, enable xpack.security and put a real API key
  # in Settings -> SIEM (ThreatEye already sends a configurable auth header).
  # --------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: threateye_elasticsearch
    profiles: ["siem"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - ingest.geoip.downloader.enabled=false
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    mem_limit: 2g
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: threateye_kibana
    profiles: ["siem"]
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_PUBLICBASEURL=http://localhost:5601
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 1500m
    restart: unless-stopped

volumes:
  gophish_data:
  ollama_data:
  postgres_data:
  caddy_data:
  caddy_config:
  es_data:
