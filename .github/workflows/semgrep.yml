# Semgrep — static analysis (tokenless OSS rules, no Semgrep Cloud account needed).
# Uploads SARIF to the Security tab.
name: Semgrep
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '29 7 * * 4'

permissions:
  contents: read

jobs:
  semgrep:
    permissions:
      contents: read
      security-events: write
    name: Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep (OSS rulesets)
        run: semgrep scan --config p/python --config p/owasp-top-ten --config p/javascript --sarif --output semgrep.sarif
        continue-on-error: true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
