# Bandit — Python security linter for the running service code.
#
# Scope: backend/ (the FastAPI service). The pytest suite (backend/tests, which
# legitimately uses asserts — B101) and the offline operator/build scripts in
# scripts/ (intended subprocess/urllib/random usage) are out of scope — they are
# not the deployed web service. Results appear under the Security tab.
name: Bandit
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '16 4 * * 5'

permissions:
  contents: read

jobs:
  bandit:
    permissions:
      contents: read            # for actions/checkout
      security-events: write    # to upload SARIF to the Security tab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Bandit
        run: pip install "bandit[sarif]"
      - name: Run Bandit on the service code
        run: bandit -r backend -x backend/tests,backend/.pytest_cache -f sarif -o bandit.sarif
        continue-on-error: true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit.sarif
          category: bandit
